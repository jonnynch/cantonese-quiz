name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # jsdom 31 requires Node ^22.22.2 || ^24.15.0 || >=26 (see "engines" in package.json)
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The project has no build or lint script; the automated tests are the only required check.
      - name: Run tests
        run: npm test
