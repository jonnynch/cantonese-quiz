<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>識字小天地</title>
<meta name="description" content="繁體中文與廣東話識字練習">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7d6b">
<meta name="application-name" content="中文識字">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="中文識字">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{--bg:#faf8f2;--ink:#1d2b3a;--mut:#667180;--card:#fff;--line:#ddd7c9;--jade:#2f7d6b;--red:#c8402f;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191f;--ink:#eee9dd;--mut:#9aa4b0;--card:#1e252d;--line:#333c46;--jade:#5fb59f;--red:#e8705f;--on:#10151a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191f;--ink:#eee9dd;--mut:#9aa4b0;--card:#1e252d;--line:#333c46;--jade:#5fb59f;--red:#e8705f;--on:#10151a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif}
.han{font-family:"Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC",serif}
#nav{display:flex;gap:6px;padding:10px 12px;border-bottom:2px solid var(--line);overflow-x:auto}
#nav button{flex:1;min-height:52px;min-width:84px;border:0;border-radius:12px;background:transparent;color:var(--mut);font:inherit;font-weight:700;white-space:nowrap}
#nav button.on{background:var(--ink);color:var(--bg)}
#main{max-width:980px;margin:0 auto;padding:16px}
h2,h3,h4{margin:.2em 0 .4em}small{color:var(--mut);font-weight:400}
.b{min-height:56px;padding:0 24px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.b.p{background:var(--jade);border-color:var(--jade);color:var(--on)}
.b.r{background:var(--red);border-color:var(--red);color:var(--on)}
.b.on{outline:4px solid var(--ink)}
.b:disabled{opacity:.4}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.stage{display:flex;flex-direction:column;align-items:center;gap:6px}
.big{font-size:min(46vw,42vh,340px);line-height:1.1;margin:6px 0}
.mid{font-size:64px;line-height:1.1}
.ans{font-size:72px;min-height:80px;line-height:1.1}
.spk{font-size:26px;min-width:150px;min-height:72px}
#main .five{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%;max-width:980px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.slot .no{position:absolute;top:6px;left:8px;font-weight:700;font-size:1.3em;background:var(--jade);color:var(--on);border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;z-index:1}
.slot canvas{width:100%;min-width:0;max-width:300px}.slot canvas.ok{border-color:var(--jade)}
#main .mst{display:inline-block;font-size:.65em;font-weight:700;padding:2px 10px;border-radius:14px;border:2px solid var(--ink);vertical-align:middle}.mst.mastered{background:var(--jade);border-color:var(--jade);color:var(--on)}.mst.notStarted{opacity:.7}
.seg{display:flex;gap:6px;margin-top:8px}.seg .seg-b{flex:1;min-height:44px;font-size:.95em}.seg .seg-b.on{background:var(--jade);border-color:var(--jade);color:var(--on)}.lvl.mastered{border-color:var(--jade)}
#main .endb{background:transparent;color:var(--red);border-color:var(--red);font-size:.9em;min-width:64px}#main .mkone{gap:10px}.mkprog{font-size:1.6em;font-weight:700}.mkimg{width:min(90vw,48vh,520px);aspect-ratio:1;object-fit:contain;border:2px solid var(--line);background:#fff;border-radius:8px}
#main .mkrow{width:100%;max-width:640px}#main .mkrow .b{flex:1;min-height:76px;font-size:1.6em}.mkchip{min-width:64px}
.streak{font-size:1.4em;display:flex;gap:10px;align-items:center}.dot{display:inline-block;width:.9em;height:.9em;margin:0 .15em;border-radius:50%;border:2px solid var(--jade);background:transparent}.dot.on{background:var(--jade)}
.fb{min-height:1.5em;font-weight:700;color:var(--ink)}#cc{width:min(94vw,calc(100vh - 330px),720px);min-width:280px}.phase{margin:2px 0;text-align:center}.mkchip.on{outline:3px solid var(--ink)}
canvas{width:min(92vw,calc(100vh - 360px),640px);min-width:260px;aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:8px;touch-action:none}
.mk img,.card img{width:100%;max-width:240px;border:1px solid var(--line);background:#fff;border-radius:6px}
.line{display:flex;justify-content:space-between;width:100%;padding:6px 0;border-top:1px solid var(--line)}
button.line{border-radius:0;background:transparent;min-height:48px;padding:0 4px}
.g{color:var(--jade)}.rd{color:var(--red)}.warn{color:var(--red);margin:4px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal form{width:min(460px,100%);max-height:100%;overflow:auto}
label{display:block;margin:8px 0;font-weight:600}
input{width:100%;min-height:50px;font:inherit;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button.who{display:flex;align-items:center;gap:8px;font-weight:700}
button.who small{font-weight:400;opacity:.75}
.av1{font-size:1.5em;line-height:1}.av1.big{font-size:2.6em}
button.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;cursor:pointer;font:inherit;color:inherit}
button.pick .av{font-size:4em;line-height:1}button.pick .nm{font-size:1.4em;font-weight:700}
.prow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.prow .grow{flex:1;font-size:1.2em}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.avs .av{font-size:2.2em;min-height:64px;border:3px solid transparent;border-radius:14px;background:var(--card);cursor:pointer}
.avs .av.on{border-color:var(--jade)}
#updbar{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--card);border:3px solid var(--jade);border-radius:14px;padding:12px 16px;z-index:12;box-shadow:0 4px 20px rgba(0,0,0,.35)}
#updbar[hidden]{display:none}
#errbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border:3px solid var(--red);border-radius:14px;padding:12px 16px;z-index:11;box-shadow:0 4px 20px rgba(0,0,0,.35)}
#errbar[hidden]{display:none}
ul.warn{margin:4px 0;padding-left:1.4em}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:10}
</style></head><body>
<div id="nav"></div><div id="main"></div>
<script src="js/storage.js"></script>
<script src="js/core.js"></script>
<script src="js/profiles.js"></script>
<script src="js/backup.js"></script>
<script src="js/pwa.js"></script>
<script src="js/app.js"></script>
</body></html>
